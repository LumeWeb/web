name: "Create envfile"
description: "Write a .env file from key-value pairs. Reports found vs missing keys."
inputs:
  directory:
    description: "Directory where .env file should be written"
    required: true
  env-keys:
    description: "JSON object mapping env var names to values"
    required: true
  fail-on-empty:
    description: "Comma-separated list of keys that must be non-empty (action fails if empty/missing)"
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Write .env file and audit keys
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        ENV_KEYS: ${{ inputs.env-keys }}
        FAIL_ON_EMPTY: ${{ inputs.fail-on-empty }}
      run: |
        set -euo pipefail
        mkdir -p "$DIRECTORY"

        # Build the .env file from JSON
        echo "$ENV_KEYS" | jq -r \
          'to_entries[] | select(.key != "" and .value != null and .value != "") | "\(.key)=\(.value)"' \
          > "$DIRECTORY/.env"

        echo "Wrote .env to $DIRECTORY/.env"

        # Audit: which keys are present vs empty/missing
        ALL_KEYS=$(echo "$ENV_KEYS" | jq -r 'keys[]')
        FOUND_KEYS=()
        MISSING_KEYS=()

        for key in $ALL_KEYS; do
          val=$(echo "$ENV_KEYS" | jq -r --arg k "$key" '.[$k] // empty')
          if [[ -n "$val" && "$val" != "null" ]]; then
            FOUND_KEYS+=("$key")
          else
            MISSING_KEYS+=("$key")
          fi
        done

        echo ""
        echo "=== Env Audit ==="
        if [[ ${#FOUND_KEYS[@]} -gt 0 ]]; then
          echo "Found (${#FOUND_KEYS[@]}):"
          printf '  - %s\n' "${FOUND_KEYS[@]}"
        fi
        if [[ ${#MISSING_KEYS[@]} -gt 0 ]]; then
          echo "Missing/empty (${#MISSING_KEYS[@]}):"
          printf '  - %s\n' "${MISSING_KEYS[@]}"
        fi
        echo "================="
        echo ""

        # Fail if any required key is empty
        if [[ -n "$FAIL_ON_EMPTY" ]]; then
          IFS=',' read -ra REQUIRED <<< "$FAIL_ON_EMPTY"
          FAILED=()
          for key in "${REQUIRED[@]}"; do
            key=$(echo "$key" | xargs) # trim whitespace
            val=$(echo "$ENV_KEYS" | jq -r --arg k "$key" '.[$k] // empty')
            if [[ -z "$val" || "$val" == "null" ]]; then
              FAILED+=("$key")
            fi
          done
          if [[ ${#FAILED[@]} -gt 0 ]]; then
            echo "::error::Required env vars are empty or missing: ${FAILED[*]}"
            exit 1
          fi
        fi
