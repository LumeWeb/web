name: Deploy docs.pinner.xyz

on:
  push:
    branches:
      - develop
    paths:
      - "apps/docs.pinner.xyz/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  deployments: write
  contents: read
  packages: write

jobs:
  deploy:
    name: Deploy docs.pinner.xyz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Setup
        uses: LumeWeb/workflows/.github/actions/setup-all@develop
      - name: Install pinner-cli
        uses: ./.github/actions/setup-pinner-cli
      - name: Build
        run: pnpm build:docs.pinner.xyz
      - name: Deploy to IPFS via Pinner
        id: deploy_pinner
        uses: lumeweb/pinner-deploy-action@v0
        with:
          api-key: ${{ secrets.PINNER_API_KEY }}
          path: apps/docs.pinner.xyz/dist/public
          domain: docs.pinner.xyz
          remove-previous: true

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lumeweb/docs.pinner.xyz
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/docs.pinner.xyz/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
