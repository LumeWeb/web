name: Deploy docs.pinner.xyz

on:
  push:
    branches:
      - develop
    paths:
      - "apps/docs.pinner.xyz/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  deployments: write
  contents: read

jobs:
  deploy:
    name: Deploy docs.pinner.xyz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Setup
        uses: LumeWeb/workflows/.github/actions/setup-all@develop
      - name: Install pinner-cli
        uses: ./.github/actions/setup-pinner-cli
      - name: Build
        run: pnpm build:docs.pinner.xyz
      - name: Deploy to IPFS via Pinner
        id: deploy_pinner
        uses: lumeweb/pinner-deploy-action@v0
        with:
          api-key: ${{ secrets.PINNER_API_KEY }}
          path: apps/docs.pinner.xyz/dist/public
          domain: docs.pinner.xyz
          remove-previous: true
