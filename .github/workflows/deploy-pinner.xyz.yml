name: Deploy pinner.xyz

on:
  push:
    branches:
      - develop
    paths:
      - "apps/pinner.xyz/**"
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}
permissions:
  deployments: write
  contents: read

jobs:
  deploy:
    name: Deploy pinner.xyz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
      - name: Setup
        uses: LumeWeb/workflows/.github/actions/setup-all@develop
      - name: Make envfile
        uses: ./.github/actions/create-envfile
        with:
          directory: apps/pinner.xyz
          env-keys: |
            {
              "PUBLIC_PORTAL_API_URL": "${{ vars.PINNER_PORTAL_API_URL }}",
              "PUBLIC_LISTMONK_URL": "${{ vars.PINNER_LISTMONK_URL }}",
              "PUBLIC_LISTMONK_LIST_UUID": "${{ vars.PINNER_LISTMONK_LIST_UUID }}",
              "PUBLIC_POSTHOG_PROJECT_TOKEN": "${{ secrets.PINNER_POSTHOG_PROJECT_TOKEN }}",
              "PUBLIC_POSTHOG_HOST": "${{ vars.PINNER_POSTHOG_HOST }}"
            }
          fail-on-empty: "PUBLIC_POSTHOG_PROJECT_TOKEN,PUBLIC_POSTHOG_HOST"
      - name: Build
        run: pnpm build:pinner.xyz
      - name: Write IndexNow key file
        uses: ./.github/actions/indexnow-write-key
        with:
          public-path: apps/pinner.xyz/dist
          key: ${{ vars.INDEXNOW_KEY_PINNER }}
      - name: Deploy to IPFS via Pinner
        id: deploy_pinner
        uses: lumeweb/pinner-deploy-action@v0
        with:
          api-key: ${{ secrets.PINNER_API_KEY }}
          path: apps/pinner.xyz/dist
          domain: pinner.xyz
          remove-previous: true
      - name: Submit URLs to IndexNow
        uses: ./.github/actions/indexnow
        with:
          build-path: apps/pinner.xyz/dist
          site: pinner.xyz
          key: ${{ vars.INDEXNOW_KEY_PINNER }}
