name: sia-testing

on:
  push:
    paths:
      - 'libs/sia-testing/**'
      - 'libs/tsdown-config/**'
      - 'libs/sia-video-source/**'
      - 'apps/sia-video-demo/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sia-testing.yml'
      - '.github/workflows/sia-testing-real.yml'
  pull_request:
    paths:
      - 'libs/sia-testing/**'
      - 'libs/tsdown-config/**'
      - 'libs/sia-video-source/**'
      - 'apps/sia-video-demo/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/sia-testing.yml'
      - '.github/workflows/sia-testing-real.yml'

concurrency:
  group: sia-testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: LumeWeb/workflows/.github/actions/setup-all@develop
      - run: pnpm --filter=@lumeweb/sia-testing check-types
      - run: pnpm --filter=@lumeweb/sia-testing lint
      - run: pnpm --filter=@lumeweb/sia-testing test
      - run: pnpm --filter=@lumeweb/sia-testing test:native:helpers
      - run: pnpm --filter=@lumeweb/sia-testing test:native:control
      - run: pnpm --filter=@lumeweb/tsdown-config build:config
      - run: pnpm --filter=@lumeweb/sia-testing test:package
      - run: pnpm --filter=@lumeweb/sia-testing test:consumers
      - run: pnpm --filter=@lumeweb/sia-video-source test:e2e:sdk:offline
      - run: pnpm --filter=@lumeweb/sia-video-source test:e2e:sdk:build
      - run: pnpm --filter=@lumeweb/sia-video-source exec tsc --noEmit -p tsconfig.contract.json
      - run: pnpm --filter=@lumeweb/sia-video-source exec oxlint tests/contract playwright.contract.config.ts
      - run: pnpm --filter=@lumeweb/sia-video-demo test
      - run: pnpm --filter=@lumeweb/sia-video-demo typecheck
      - run: pnpm --filter=@lumeweb/sia-video-demo exec tsc --noEmit -p tsconfig.mock.json
      - run: pnpm --filter=@lumeweb/sia-video-demo exec oxlint tests/playback playwright.mock.config.ts src/components/player/SiaVideoMount.tsx src/components/player/SiaVideoMount.spec.ts src/components/player/SiaVideoMount.runtime.spec.ts
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: LumeWeb/workflows/.github/actions/setup-all@develop
      - run: pnpm --filter=@lumeweb/sia-testing exec playwright install --with-deps chromium firefox
      - run: pnpm --filter=@lumeweb/sia-testing test:browser
      - run: pnpm --filter=@lumeweb/sia-video-source test:e2e:mock
      - run: pnpm --filter=@lumeweb/sia-video-demo test:e2e:mock
      - run: pnpm --filter=@lumeweb/sia-video-source exec tsc --noEmit -p tsconfig.mock.json
      - run: pnpm --filter=@lumeweb/sia-video-source exec oxlint tests/playback playwright.mock.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: video-playback-failures
          path: libs/sia-video-source/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: demo-playback-failures
          path: apps/sia-video-demo/test-results/
          if-no-files-found: ignore
