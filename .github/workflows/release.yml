name: Release

on:
  workflow_dispatch:
    inputs:
      knope_version:
        description: 'Knope version to use (default: latest)'
        required: false
        default: ''

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Install Knope
        uses: knope-dev/action@v2.1.2
        with:
          version: ${{ inputs.knope_version }}

      - name: Setup Git
        uses: LumeWeb/workflows/.github/actions/setup-git@develop

      - name: Setup JS
        uses: LumeWeb/workflows/.github/actions/setup-js@develop

      - name: Build
        run: pnpm build

      - name: Create Release
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Publish to npm
        run: NODE_AUTH_TOKEN="" pnpm publish:npm

      # Release the Go modules
      - name: Trigger Go module release
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT }}
          repository: lumeweb/web
          event-type: release-go
