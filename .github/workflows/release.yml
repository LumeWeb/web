name: Release

on:
  workflow_dispatch:
    inputs:
      knope_version:
        description: 'Knope version to use (default: latest)'
        required: false
        default: ''

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Install Knope
        uses: knope-dev/action@v2.1.0
        with:
          version: ${{ inputs.knope_version }}

      - name: Setup Git
        uses: LumeWeb/workflows/.github/actions/setup-git@develop

      - name: Setup JS
        uses: LumeWeb/workflows/.github/actions/setup-js@develop

      - name: Build
        run: pnpm build

      - name: Create Release
        run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}


      - run: unset NODE_AUTH_TOKEN

      - name: Publish to npm
        run: pnpm publish:npm

      # Check for portal-frontend changes and notify template repo
      - name: Check portal-frontend changes and notify
        id: check-changes
        run: |
          CHANGES=$(git diff --name-only HEAD^ HEAD apps/portal-frontend)
          if [ ! -z "$CHANGES" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - if: steps.check-changes.outputs.has_changes == 'true'
        name: Trigger portal-frontend template repo update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: lumeweb/portal-frontend-template
          event-type: portal-frontend-update
          client-payload: |
            {
              "source_sha": "${{ github.sha }}",
              "source_ref": "${{ github.ref }}"
            }

      # Release the Go modules
      - name: Trigger Go module release
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: lumeweb/web
          event-type: release-go
