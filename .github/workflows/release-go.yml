name: Release Go modules

concurrency: commits-to-master

on:
  repository_dispatch:
    types: [release-go]
  workflow_dispatch:
    inputs:
      targets:
        description: 'Specific targets to build (CSV format, "all" for defaults)'
        required: false
        default: 'all'
        type: string
      
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Show what would be built without actually building'
        required: false
        default: false
        type: boolean
      validate_only:
        description: 'Only validate configuration without building'
        required: false
        default: false
        type: boolean
      force:
        description: 'Force release even if no git changes detected'
        required: false
        default: false
        type: boolean
      no_push:
        description: 'Create commit but do not push to remote'
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get_modified_apps.outputs.matrix }}
      has_changes: ${{ steps.get_modified_apps.outputs.has_changes }}
      commit_hash: ${{ steps.release.outputs.commit_hash }}
    steps:
      - name: Checkout all commits
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup
        uses: LumeWeb/workflows/.github/actions/setup-all@develop

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Release
        id: release
        env:
          VITE_PORTAL_BRAND: ${{ vars.VITE_PORTAL_BRAND }}
        run: |
          ARGS=()
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.targets }}" != "all" ]; then
              ARGS+=("--targets" "${{ inputs.targets }}")
            fi
            if [ "${{ inputs.force }}" = "true" ]; then
              ARGS+=("--force")
            fi
            if [ "${{ inputs.no_push }}" = "true" ]; then
              ARGS+=("--no-push")
            fi
            if [ "${{ inputs.verbose }}" = "true" ]; then
              ARGS+=("--verbose")
            fi
            if [ "${{ inputs.dry_run }}" = "true" ]; then
              ARGS+=("--dry-run")
            fi
            if [ "${{ inputs.validate_only }}" = "true" ]; then
              ARGS+=("--validate-only")
            fi
          fi
          
          echo "Running: python scripts/release-go.py ${ARGS[*]}"
          python scripts/release-go.py "${ARGS[@]}"

      - name: Get modified apps info
        id: get_modified_apps
        run: |
          if [ ! -f "/tmp/modified_apps.txt" ]; then
            echo "matrix={\"include\":[{\"repo\":\"__placeholder__\"}]}" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          # Generate matrix JSON and check for placeholder
          matrix_json=$(jq -nR '[inputs | select(length > 0) | {repo: .}] | if length > 0 then unique_by(.repo) | {include: .} else {include: [{repo: "__placeholder__"}]} end' < /tmp/modified_apps.txt)
          
          # Check if we have actual repos (not just placeholder)
          if echo "$matrix_json" | grep -q '"__placeholder__"'; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          
          # Output matrix as a single line (compact JSON)
          echo "matrix=$(echo "$matrix_json" | jq -c)" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Skip placeholder
        if: matrix.repo == '__placeholder__'
        run: echo "No changes to dispatch"

      - name: Dispatch UI update
        if: matrix.repo != '__placeholder__'
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: LumeWeb/${{ matrix.repo }}
          event-type: update-ui
          client-payload: |
            {
              "commit_hash": "${{ needs.prepare.outputs.commit_hash }}",
              "repository": "${{ github.repository }}"
            }
