name: Release Go modules

concurrency: commits-to-master

on:
  repository_dispatch:
    types: [release-go]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get_modified_apps.outputs.matrix }}
      has_changes: ${{ steps.get_modified_apps.outputs.has_changes }}
      commit_hash: ${{ steps.release.outputs.commit_hash }}
    steps:
      - name: Checkout all commits
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup
        uses: LumeWeb/workflows/.github/actions/setup-all@develop

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Release
        id: release
        run: |
          python scripts/release-go.py

      - name: Get modified apps info
        id: get_modified_apps
        run: |
          if [ ! -f "/tmp/modified_apps.txt" ] || [ ! -s "/tmp/modified_apps.txt" ]; then
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read modified apps and create matrix JSON
          while IFS= read -r app; do
            # Map app names to repository names
            # portal-frontend -> portal-plugin-frontend
            # portal-app-shell -> portal-plugin-app-shell
            # portal-plugin-dashboard -> portal-plugin-dashboard (already correct)
            if [[ "$app" == portal-plugin-* ]]; then
              repo="$app"
            else
              base_name=${app#portal-}
              repo="portal-plugin-$base_name"
            fi
            jq -n --arg app "$app" --arg repo "$repo" '{app: $app, repo: $repo}'
          done < /tmp/modified_apps.txt | jq -s '{include: .}' | tr -d '\n' > /tmp/matrix.json

          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Dispatch UI update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: LumeWeb/${{ matrix.repo }}
          event-type: update-ui
          client-payload: |
            {
              "commit_hash": "${{ needs.prepare.outputs.commit_hash }}",
              "app_name": "${{ matrix.app }}",
              "repository": "${{ github.repository }}",
              "ref": "${{ github.ref }}"
            }
