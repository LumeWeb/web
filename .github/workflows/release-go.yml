name: Release Go modules

concurrency: commits-to-master

on:
  repository_dispatch:
    types: [release-go]
  workflow_dispatch:
    inputs:
      apps:
        description: 'Apps to build and release (CSV format, "all" for defaults, "none" to skip)'
        required: false
        default: 'all'
        type: string
      plugins:
        description: 'Plugins to build and release (CSV format, "all" for defaults, "none" to skip)'
        required: false
        default: 'all'
        type: string
      force:
        description: 'Force release even if no git changes detected'
        required: false
        default: false
        type: boolean
      no_push:
        description: 'Create commit but do not push to remote'
        required: false
        default: false
        type: boolean
      verbose:
        description: 'Enable verbose output'
        required: false
        default: false
        type: boolean

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.get_modified_apps.outputs.matrix }}
      has_changes: ${{ steps.get_modified_apps.outputs.has_changes }}
      commit_hash: ${{ steps.release.outputs.commit_hash }}
    steps:
      - name: Checkout all commits
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup
        uses: LumeWeb/workflows/.github/actions/setup-all@develop

      - name: Configure Git
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

      - name: Release
        id: release
        run: |
          args=""
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.apps }}" != "all" ]; then
              args="$args --apps '${{ inputs.apps }}'"
            fi
            if [ "${{ inputs.plugins }}" != "all" ]; then
              args="$args --plugins '${{ inputs.plugins }}'"
            fi
            if [ "${{ inputs.force }}" = "true" ]; then
              args="$args --force"
            fi
            if [ "${{ inputs.no_push }}" = "true" ]; then
              args="$args --no-push"
            fi
            if [ "${{ inputs.verbose }}" = "true" ]; then
              args="$args --verbose"
            fi
          fi
          
          echo "Running: python scripts/release-go.py $args"
          python scripts/release-go.py $args

      - name: Get modified apps info
        id: get_modified_apps
        run: |
          if [ ! -f "/tmp/modified_apps.txt" ]; then
            echo "matrix={\"include\":[{\"repo\":\"__placeholder__\"}]}" >> "$GITHUB_OUTPUT"
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          jq -nR '[inputs | select(length > 0) | {repo: .}] | if length > 0 then unique_by(.repo) | {include: .} else {include: [{repo: "__placeholder__"}]} end' < /tmp/modified_apps.txt > /tmp/matrix.json

          # Check if we have actual repos (not just placeholder)
          if grep -q '"__placeholder__"' /tmp/matrix.json; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
          
          echo "matrix=$(cat /tmp/matrix.json)" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: prepare
    if: needs.prepare.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Skip placeholder
        if: matrix.repo == '__placeholder__'
        run: echo "No changes to dispatch"

      - name: Dispatch UI update
        if: matrix.repo != '__placeholder__'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: LumeWeb/${{ matrix.repo }}
          event-type: update-ui
          client-payload: |
            {
              "commit_hash": "${{ needs.prepare.outputs.commit_hash }}",
              "repository": "${{ github.repository }}"
            }
