name: Update Dependencies

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * 0'

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout all commits
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JS
        uses: LumeWeb/workflows/.github/actions/setup-js@develop

      - name: Run taze
        run: pnpm taze major -r -w --install false
        shell: bash

      - name: Update lockfile
        run: pnpm install --no-frozen-lockfile --config.dangerouslyAllowAllBuilds=true
        shell: bash

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update dependencies"
          title: "chore(deps): update dependencies"
          body: |
            ## Dependency Updates

            This PR updates dependencies across all packages using taze.
          branch: chore/update-dependencies
          delete-branch: true
          labels: |
            dependencies
            chore
          draft: false
