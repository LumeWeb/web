# Pinner Docs Backend - Railway service config
#
# Architecture:
#   Static frontend -> IPFS (full-static build, backendUrl set)
#   This backend     -> Railway (dynamic build, serves MCP/feedback/OG)
#
# Build context is the monorepo root (needed for pnpm-lock.yaml
# and pnpm-workspace.yaml). The Dockerfile path points to the
# service's own Dockerfile within apps/docs.pinner.xyz/.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/docs.pinner.xyz/Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 30
